name: SC compiler CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld
      - name: Build with warnings as errors
        env:
          CXX: clang++
          CXXFLAGS: -Wall -Wextra -Werror
        run: ./build.sh
      - name: Run conformance and regression tests
        run: ./test.sh
      - name: Run ASan and UBSan tests
        env:
          CXX: clang++
          CXXFLAGS: -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ./test.sh
